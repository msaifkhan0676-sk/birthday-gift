<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    /* Background glow */
    body::before {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      filter: blur(70px);
      top: 5%;
      left: 5%;
    }

    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      background: rgba(255, 220, 100, 0.2);
      border-radius: 50%;
      filter: blur(70px);
      bottom: 5%;
      right: 5%;
    }

    /* Birthday card */
    .card {
      width: min(90%, 600px);
      padding: 45px 25px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 10;
      animation: cardAppear 1s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .cake {
      font-size: 75px;
      animation: bounce 1.5s infinite;
      margin-bottom: 10px;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      margin-bottom: 10px;
      text-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
    }

    .name {
      color: #ffe66d;
      font-weight: bold;
    }

    .subtitle {
      font-size: clamp(1rem, 4vw, 1.3rem);
      line-height: 1.6;
      margin: 15px auto 25px;
      max-width: 480px;
    }

    .message {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: #fff;
      color: #d63384;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Balloons */
    .balloon {
      position: fixed;
      bottom: -120px;
      font-size: 65px;
      z-index: 2;
      animation: floatUp linear infinite;
    }

    .balloon:nth-child(1) {
      left: 5%;
      animation-duration: 9s;
    }

    .balloon:nth-child(2) {
      left: 25%;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    .balloon:nth-child(3) {
      right: 20%;
      animation-duration: 10s;
      animation-delay: 1s;
    }

    .balloon:nth-child(4) {
      right: 5%;
      animation-duration: 13s;
      animation-delay: 3s;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(-5deg);
      }
      to {
        transform: translateY(-120vh) rotate(10deg);
      }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 18px;
      top: -30px;
      z-index: 20;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-30px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.8;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 35px 20px;
        border-radius: 25px;
      }

      .cake {
        font-size: 60px;
      }

      .message {
        font-size: 0.95rem;
      }

      button {
        width: 100%;
        max-width: 280px;
      }

      .balloon {
        font-size: 45px;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>

  <!-- Birthday Card -->
  <div class="card">

    <div class="cake">🎂</div>

    <h1>
      Happy Birthday<br>
      <span class="name">shifa 🎉</span>
    </h1>

    <p class="subtitle">
      Wishing you a day filled with happiness, laughter and unforgettable memories! ✨
    </p>

    <p class="message">
      May this new year of your life bring you lots of success,
      beautiful moments, and countless reasons to smile. 💖
      <br><br>
      Have an amazing birthday! 🥳
    </p>

    <button onclick="celebrate()">
      🎉 Celebrate!
    </button>

  </div>

  <script>

    function createConfetti(amount = 120) {

      const colors = [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#4dabf7",
        "#c77dff",
        "#ffffff"
      ];

      for (let i = 0; i < amount; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          Math.random() * 8 + 5 + "px";

        confetti.style.height =
          Math.random() * 12 + 8 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 2 + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    function celebrate() {
      createConfetti(180);

      // Little button effect
      const button = document.querySelector("button");

      button.innerHTML = "🎊 Yay! 🎊";

      setTimeout(() => {
        button.innerHTML = "🎉 Celebrate!";
      }, 2000);
    }

    // Automatic confetti when page loads
    window.addEventListener("load", () => {
      setTimeout(() => {
        createConfetti(100);
      }, 500);
    });

  </script>

</body>
</html>
